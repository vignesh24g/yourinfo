<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YourInfo – Spider‑Man Theme</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --spidey-red: #e50914;
      --spidey-blue: #0d47a1;
      --spidey-black: #111;
      --spidey-white: #fff;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--spidey-red), var(--spidey-blue));
      color: var(--spidey-white);
      margin: 0;
      padding: 0;
      transition: background 0.3s, color 0.3s;
    }
    header {
      font-family: 'Bangers', cursive;
      background: var(--spidey-black);
      color: var(--spidey-red);
      padding: 25px;
      text-align: center;
      font-size: 2em;
      letter-spacing: 2px;
      border-bottom: 4px solid var(--spidey-blue);
      text-shadow: 2px 2px var(--spidey-blue);
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .card {
      background: rgba(17,17,17,0.9);
      border: 2px solid var(--spidey-red);
      border-radius: 12px;
      box-shadow: 0 0 12px var(--spidey-blue);
      padding: 20px;
      transition: transform 0.2s, box-shadow 0.3s;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px var(--spidey-red);
    }
    h2 {
      margin-top: 0;
      font-family: 'Bangers', cursive;
      font-size: 1.4em;
      color: var(--spidey-red);
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 1px 1px var(--spidey-blue);
    }
    .info {
      font-size: 0.95em;
      line-height: 1.5em;
      color: var(--spidey-white);
    }
    footer {
      text-align: center;
      padding: 15px;
      font-size: 0.9em;
      background: var(--spidey-black);
      color: var(--spidey-blue);
      font-family: 'Bangers', cursive;
      letter-spacing: 1px;
    }
    .toggle {
      position: fixed;
      top: 15px;
      right: 15px;
      background: var(--spidey-blue);
      color: var(--spidey-white);
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 8px var(--spidey-red);
    }
  </style>
</head>
<body>
  <header>🕸️ YourInfo – Spider‑Man Edition 🕷️</header>
  <button class="toggle" onclick="toggleTheme()">Toggle Theme</button>
  <div class="container">
    <div class="card" id="system"></div>
    <div class="card" id="hardware"></div>
    <div class="card" id="network"></div>
    <div class="card" id="battery"></div>
    <div class="card" id="location"></div>
    <div class="card" id="ip"></div>
    <div class="card" id="gpu"></div>
    <div class="card" id="devices"></div>
    <div class="card" id="orientation"></div>
    <div class="card" id="storage"></div>
    <div class="card" id="permissions"></div>
    <div class="card" id="other"></div>
  </div>
  <footer>🕷️ With great power comes great responsibility – know your browser’s power!</footer>

  <script>
    function addInfo(id, title, content, icon="ℹ️") {
      document.getElementById(id).innerHTML = `<h2>${icon} ${title}</h2><div class="info">${content}</div>`;
    }

    // Example: System Info
    addInfo("system", "System", `
      Browser: ${navigator.userAgent}<br>
      Platform: ${navigator.platform}<br>
      Languages: ${navigator.languages.join(", ")}<br>
      Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}<br>
      Screen: ${screen.width} x ${screen.height}, ${screen.colorDepth}-bit
    `, "💻");

    // (Keep the rest of your JS info-gathering code from the previous version)
    // Theme toggle (switch between Spidey dark and light)
    function toggleTheme() {
      const isDark = document.body.style.background.includes("var(--spidey-red)");
      if (isDark) {
        document.body.style.background = "white";
        document.body.style.color = "black";
        document.querySelector("header").style.background = "#eee";
        document.querySelector("header").style.color = "#0d47a1";
        document.querySelectorAll(".card").forEach(c => {
          c.style.background = "#fff";
          c.style.color = "#000";
          c.style.border = "2px solid #0d47a1";
        });
      } else {
        document.body.style.background = `linear-gradient(135deg, var(--spidey-red), var(--spidey-blue))`;
        document.body.style.color = "var(--spidey-white)";
        document.querySelector("header").style.background = "var(--spidey-black)";
        document.querySelector("header").style.color = "var(--spidey-red)";
        document.querySelectorAll(".card").forEach(c => {
          c.style.background = "rgba(17,17,17,0.9)";
          c.style.color = "var(--spidey-white)";
          c.style.border = "2px solid var(--spidey-red)";
        });
      }
    }
  </script>
</body>
</html>
